name: Frontend Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  secret-detection:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Write CI Summary
        run: echo "### Secret Detection Completed :white_check_mark:" >> $GITHUB_STEP_SUMMARY

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    needs: secret-detection
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci

      - name: Linting
        run: npm run lint
        
      - name: Unit & Integration Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
          REDIS_URL: redis://localhost:6379
          AUTH_SECRET: test-secret-32-characters-long-minimum
          NODE_ENV: test
        run: npm run test:coverage
        
      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: coverage/
          
      - name: Software Composition Analysis (NPM Audit)
        run: npm audit --audit-level=high || true
        
      - name: Initialize CodeQL (SAST)
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript,typescript"
          
      - name: Production Build
        run: npm run build
        
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/
          
      - name: Write CI Summary
        run: |
          echo "### Frontend CI Completed :white_check_mark:" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: Completed (Coverage artifacts uploaded)" >> $GITHUB_STEP_SUMMARY
          echo "- SAST (CodeQL): Completed" >> $GITHUB_STEP_SUMMARY
          echo "- SCA (Audit): Completed" >> $GITHUB_STEP_SUMMARY
