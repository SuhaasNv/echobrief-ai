name: Frontend Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

# ─────────────────────────────────────────────────────────────────────────────
# Every job is its own node so the GitHub Actions graph shows the full pipeline
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # ── Node 1 ────────────────────────────────────────────────────────────────
  install-dependencies:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-nm-${{ hashFiles('**/package-lock.json') }}

  # ── Node 2 ────────────────────────────────────────────────────────────────
  secrets-detection:
    name: Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secrets Detection step
        run: echo "Secrets Detection category — delegates to Gitleaks job"

  # ── Node 3 ────────────────────────────────────────────────────────────────
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    needs: [secrets-detection]
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Node 4 ────────────────────────────────────────────────────────────────
  production-build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [install-dependencies]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-nm-${{ hashFiles('**/package-lock.json') }}
      - name: Production build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/

  # ── Node 5 ────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [install-dependencies]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-nm-${{ hashFiles('**/package-lock.json') }}
      - name: ESLint
        run: npm run lint

  # ── Node 6 ────────────────────────────────────────────────────────────────
  unit-integration-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-nm-${{ hashFiles('**/package-lock.json') }}
      - name: Run unit and integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
          REDIS_URL: redis://localhost:6379
          AUTH_SECRET: test-secret-32-characters-long-minimum
          NODE_ENV: test
        run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: coverage/

  # ── Node 7 ────────────────────────────────────────────────────────────────
  sca:
    name: SCA
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: SCA category — delegates to npm-audit and owasp-dependency-check
        run: echo "Software Composition Analysis"

  # ── Node 8 ────────────────────────────────────────────────────────────────
  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    needs: [sca]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-nm-${{ hashFiles('**/package-lock.json') }}
      - name: npm audit
        run: npm audit --audit-level=high || true

  # ── Node 9 ────────────────────────────────────────────────────────────────
  sca-owasp-dependency-check:
    name: SCA — OWASP Dependency Check
    runs-on: ubuntu-latest
    needs: [sca]
    steps:
      - uses: actions/checkout@v4
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "frontend"
          path: "."
          format: "HTML"
          out: "owasp-dependency-reports"
          args: >
            --failOnCVSS 7
            --enableRetired
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-report
          path: owasp-dependency-reports/

  # ── Node 10 ───────────────────────────────────────────────────────────────
  sast:
    name: SAST
    runs-on: ubuntu-latest
    needs: [install-dependencies]
    steps:
      - uses: actions/checkout@v4
      - name: SAST category — delegates to Semgrep and CodeQL jobs
        run: echo "Static Application Security Testing"

  # ── Node 11 ───────────────────────────────────────────────────────────────
  semgrep:
    name: SAST — Semgrep
    runs-on: ubuntu-latest
    needs: [sast]
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/typescript
            p/react
            p/owasp-top-ten
        continue-on-error: true

  # ── Node 12 ───────────────────────────────────────────────────────────────
  sast-codeql:
    name: SAST — CodeQL
    runs-on: ubuntu-latest
    needs: [sast]
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, typescript
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript,typescript"
          upload: false
          output: sarif-results
      - name: Upload SARIF as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-frontend
          path: sarif-results/

  # ── Node 13 ───────────────────────────────────────────────────────────────
  dast-owasp-zap:
    name: DAST — OWASP ZAP
    runs-on: ubuntu-latest
    needs: [production-build]
    steps:
      - uses: actions/checkout@v4
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:3000"
          cmd_options: "-a"
          allow_issue_writing: false
          fail_action: false
        continue-on-error: true

  # ── Node 14 ───────────────────────────────────────────────────────────────
  ci-frontend-summary:
    name: CI Frontend — Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - gitleaks
      - production-build
      - unit-integration-tests
      - npm-audit
      - sca-owasp-dependency-check
      - semgrep
      - sast-codeql
      - dast-owasp-zap
    steps:
      - name: Write Summary
        run: |
          echo "## CI Frontend — Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Install Dependencies | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets Detection | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Production Build | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit & Integration Tests | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| SCA | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| NPM Audit | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| SCA — OWASP Dependency Check | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| SAST | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| SAST — Semgrep | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| SAST — CodeQL | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| DAST — OWASP ZAP | ✅ |" >> $GITHUB_STEP_SUMMARY
