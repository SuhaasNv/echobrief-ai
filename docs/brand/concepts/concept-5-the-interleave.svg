<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <title>EchoBrief concept 5 — The Interleave</title>
  <desc>Each mass reaches across the centre into the other's half. The seam changes direction twice, so it cannot read as a run of steps.</desc>
  <rect width="100" height="100" fill="#06070A"/>
  <defs><clipPath id="c"><rect x="14" y="14" width="72" height="72" rx="11.52"/></clipPath></defs>
  <g clip-path="url(#c)" transform="translate(14 14) scale(0.72)">
  <polygon points="-10,44 24,44 24,28 56,28 56,60 64,60 64,44 110,44 110,-20 -10,-20" fill="#4C99F8"/>
  <polygon points="-10,56 36,56 36,40 44,40 44,72 76,72 76,56 110,56 110,120 -10,120" fill="#2FC183"/>
  </g>
</svg>
